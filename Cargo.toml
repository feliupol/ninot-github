[workspace]
members = [".", "python"]

[package]
name = "ninot-github"
version = "2026.45.0"
edition = "2024"
rust-version = "1.88"
description = "In-memory fake of the GitHub REST API and git hosting for end-to-end tests"
license = "MIT"
readme = "README.md"
repository = "https://github.com/feliupol/ninot-github"
keywords = ["testing", "fake", "mock", "github", "http"]
categories = ["development-tools::testing", "web-programming::http-server"]
include = ["/src/**", "/build.rs", "/spec/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[lib]
name = "ninot_github"

[[bin]]
name = "ninot-github"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
async-graphql = { version = "7.2", default-features = false, features = ["dynamic-schema"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
headers = "0.4"
gix = { version = "0.87", default-features = false, features = ["sha1", "revision", "attributes"] }
hmac = "0.12"
http = "1"
humantime = "2"
jsonschema = { version = "0.58", default-features = false }
mime = "0.3"
ninot-common = { version = "2026.45.2", features = ["git", "profile", "server", "tls"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
regress = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
url = "2"
winnow = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[build-dependencies]
ninot-common = { version = "2026.45.2", features = ["build"] }
schemars = "0.8"
typify = "0.8"
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", default-features = false, features = ["full", "parsing"] }

[dev-dependencies]
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde_json = "1"

# Parsing GitHub's 1.5 MB GraphQL schema takes seconds unoptimised; tests build it once per binary.
[profile.dev.package.pest]
opt-level = 3

[profile.dev.package.async-graphql-parser]
opt-level = 3
