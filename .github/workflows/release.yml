---
name: Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "0 6 * * 1"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo package --locked

  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      # The tag must name the committed version; a rerun skips a version crates.io already has.
      - env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          read -r name committed < <(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg manifest "$PWD/Cargo.toml" \
              '.packages[] | select(.manifest_path == $manifest) | "\(.name) \(.version)"')
          if [ "$committed" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match $name's committed version $committed" >&2
            exit 1
          fi
          if cargo info "$name@$version" >/dev/null 2>&1; then
            echo "$name $version is already on crates.io"
            exit 0
          fi
          cargo publish --locked -p "$name"
